kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: {{ APP_NAME }}
  namespace: teamdokumenthandtering
  labels:
    team: teamdokumenthandtering
spec:
  env:
    - name: DOKMET_PROXY_HOST
      value: "webproxy.nais"
    - name: DOKMET_PROXY_PORT
      value: "8088"
    - name: NO_NAV_SECURITY_JWT_ISSUER_AZUREV2_DISCOVERYURL
      value: {{ NO_NAV_SECURITY_JWT_ISSUER_AZUREV2_DISCOVERYURL }}
    - name: SPRING_DATASOURCE_URL
      value: {{ SPRING_DATASOURCE_URL }}
    - name: DOKMET_BASE_URL
      value: {{ DOKMET_BASE_URL }}
    - name: DOKMET_SCOPES_FOR_BFF
      value: {{ DOKMET_SCOPES_FOR_BFF }}
  image: {{ image }}
  ingresses:
    {{#each INGRESSES}}
       - {{ this }}
           {{/each}}
  liveness:
    path: /isAlive
    port: 8080
    initialDelay: 30
    failureThreshold: 10
  port: 8080
  prometheus:
    enabled: true
    path: /actuator/prometheus
  readiness:
    path: /isReady
    port: 8080
    initialDelay: 30
    timeout: 3
  replicas:
    min: {{ MIN_REPLICAS }}
    max: {{ MAX_REPLICAS }}
    cpuThresholdPercentage: 50
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
  vault:
    enabled: true
    paths:
      - kvPath: {{ SERVICEUSER_VAULT_PATH }}
        mountPath: "/secrets/serviceuser/dokmet"
      - kvPath: {{ DOKMET_DS }}
        mountPath: "/var/run/secrets/nais.io/dokmetDS"
  webproxy: true
  azure:
    application:
      enabled: true
      claims:
        extra:
          - "azp_name"
  accessPolicy:
    inbound:
      rules:
    {{#each AZURE_IAC_RULES}}
       - application: {{app}}
         namespace: {{namespace}}
         cluster: {{cluster}}
    {{/each}}