name: Deploy release to prod

on:
  release:
    types:
      - published

# NB: vi publiserer en package som brukes av andre apper som kobler seg på dokmets API
jobs:
  publish-artifact:
    permissions:
      packages: write
      contents: read
    uses: navikt/dok-workflows/.github/workflows/publish-artifact.yml@main
    with:
      java-version: '17'
    secrets: inherit
  deploy-prod:
    uses: navikt/dok-workflows/.github/workflows/deploy-prod.yml@main
    secrets: inherit
