spring.flyway.enabled=false

no.nav.security.jwt.issuer.azurev2.discoveryUrl=http://localhost:${mock-oauth2-server.port}/azurev2/.well-known/openid-configuration
no.nav.security.jwt.issuer.azurev2.acceptedAudience=gosys

azure.app.client-id=azureClientId
azure.app.client-secret=azureClientSecret
azure.openid.config.token_endpoint=http://localhost:${wiremock.server.port}/azure/token

dokmet.scopesForBff=read,write
dokmet.baseUrl=http://localhost:${wiremock.server.port}/

spring.ldap.embedded.base-dn=dc=test,dc=local
spring.ldap.embedded.credential.username=uid=admin
spring.ldap.embedded.credential.password=secret
spring.ldap.embedded.validation.schema=classpath:base-schema.ldif